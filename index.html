<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great Guessing Game</title>
<style>
  /* Colores de cada tema */
  :root {
    --bg: #232323;
    --line: transparent;
    --toggle-bg: #f5f5f5;
  }

  body.light {
    --bg: #f2f2f2;
    --line: #d6d6d6;
    --toggle-bg: #232323;
  }

  /* Modo Daltónico: Eleva la dificultad a escala de grises y contraste extremo */
  body.colorblind {
    filter: grayscale(100%) contrast(160%);
  }

  body {
    background-color: var(--bg);
    margin: 0;
    font-family: "Montserrat", "Segoe UI", Arial, sans-serif;
    transition: background-color 0.4s;
  }

  h1 {
    background-color: steelblue;
    color: white;
    margin: 0;
    padding: 24px 12px;
    text-align: center;
    text-transform: uppercase;
    font-weight: normal;
    line-height: 1.1;
    transition: background-color 0.4s;
  }

  #colorDisplay {
    display: block;
    font-size: 200%;
    margin: 8px 0;
  }

  #stripe {
    background-color: white;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 8px 12px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    align-items: center;
    text-align: center;
  }

  /* Botones sin aspecto clásico ni outline */
  button {
    background: none;
    border: none;
    color: steelblue;
    font: inherit;
    text-transform: uppercase;
    height: 32px;
    padding: 0 10px;
    cursor: pointer;
    outline: none;
    transition: color 0.3s, background-color 0.3s;
  }

  button:hover,
  button.selected {
    background-color: steelblue;
    color: white;
  }

  /* Botón de tema (Oscuro/Claro) */
  #themeToggle {
    position: fixed;
    top: 8px;
    right: 8px;
    z-index: 10;
    width: 36px;
    height: 36px;
    padding: 0;
    border-radius: 50%;
    background-color: var(--toggle-bg);
    font-size: 18px;
    line-height: 36px;
    transition: background-color 0.4s, transform 0.2s;
  }

  #themeToggle:hover {
    background-color: var(--toggle-bg);
    transform: scale(1.1);
  }

  /* Botón de Modo Daltónico */
  #colorblindToggle {
    position: fixed;
    top: 8px;
    right: 52px;
    z-index: 10;
    width: 36px;
    height: 36px;
    padding: 0;
    border-radius: 50%;
    background-color: var(--toggle-bg);
    font-size: 18px;
    line-height: 36px;
    transition: background-color 0.4s, transform 0.2s;
  }

  #colorblindToggle:hover {
    background-color: var(--toggle-bg);
    transform: scale(1.1);
  }

  /* Marcador General (Esquina superior izquierda) */
  #scoreboard {
    position: fixed;
    top: 8px;
    left: 8px;
    z-index: 10;
    background-color: rgba(0, 0, 0, 0.75);
    color: white;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    line-height: 1.4;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }

  body.light #scoreboard {
    background-color: rgba(255, 255, 255, 0.9);
    color: #232323;
    border: 1px solid #d6d6d6;
  }

  /* Mensaje con ancho mínimo estático */
  #message {
    display: inline-block;
    min-width: 190px;
    text-align: center;
    color: #232323;
    text-transform: uppercase;
    font-size: 0.9rem;
    white-space: nowrap;
  }

  #container {
    display: flex;
    flex-wrap: wrap;
    max-width: 600px;
    margin: 20px auto;
    justify-content: center;
  }

  .square {
    aspect-ratio: 1;
    border-radius: 15%;
    cursor: pointer;
    transition: background-color 0.5s;
  }
</style>
</head>
<body>

<div id="scoreboard">
  <div id="sbTitle">🏆 <b>Puntuación</b></div>
  <div id="turnIndicator" style="display: none;">Turno: Jugador 1</div>
  <div id="p1Container">Puntos: <span id="p1Score">0</span></div>
  <div id="p2Container" style="display: none;">Jugador 2: <span id="p2Score">0</span> pts</div>
</div>

<button id="colorblindToggle" aria-label="Activar modo daltónico">👁️</button>
<button id="themeToggle" aria-label="Cambiar tema">☀️</button>

<h1>
  The Great
  <span id="colorDisplay">RGB</span>
  Guessing Game
</h1>

<div id="stripe">
  <button id="reset">Nuevos Colores</button>
  <span id="message"></span>
  <button id="multiplayerToggle">Modo Multi: OFF</button>
  <button class="mode">Baby</button>
  <button class="mode">Easy</button>
  <button class="mode selected">Hard</button>
  <button class="mode">Hardcore</button>
  <button class="mode">Madness</button>
</div>

<div id="container">
  <!-- 24 cuadrados para soportar hasta el modo Madness -->
  <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
  <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
  <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
  <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
  <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
  <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
</div>

<script>
  // Variables de juego
  let numSquares = 6;
  let colors;
  let pickedColor;
  
  // Variables Multijugador y Puntuación
  let isMultiplayer = false;
  let currentPlayer = 1; // 1 o 2
  let p1Score = 0;
  let p2Score = 0;
  let currentMistakes = 0; // Errores cometidos en la ronda actual

  // Selectores
  const squares = document.querySelectorAll(".square");
  const colorDisplay = document.getElementById("colorDisplay");
  const message = document.getElementById("message");
  const h1 = document.querySelector("h1");
  const resetButton = document.getElementById("reset");
  const modeButtons = document.querySelectorAll(".mode");
  const themeButton = document.getElementById("themeToggle");
  const colorblindButton = document.getElementById("colorblindToggle");
  const multiplayerToggle = document.getElementById("multiplayerToggle");
  const sbTitle = document.getElementById("sbTitle");
  const turnIndicator = document.getElementById("turnIndicator");
  const p1Container = document.getElementById("p1Container");
  const p2Container = document.getElementById("p2Container");
  const p1ScoreSpan = document.getElementById("p1Score");
  const p2ScoreSpan = document.getElementById("p2Score");

  resetButton.addEventListener("click", reset);
  themeButton.addEventListener("click", toggleTheme);
  colorblindButton.addEventListener("click", toggleColorblind);
  multiplayerToggle.addEventListener("click", toggleMultiplayer);

  // Cuando carga la página
  function init() {
    setupModeButtons();
    setupSquares();
    reset();
  }

  // Cambiar entre tema oscuro y claro
  function toggleTheme() {
    document.body.classList.toggle("light");
    const isLight = document.body.classList.contains("light");
    themeButton.textContent = isLight ? "🌙" : "☀️";
  }

  // Activar o desactiva modo daltónico
  function toggleColorblind() {
    document.body.classList.toggle("colorblind");
    const isColorblind = document.body.classList.contains("colorblind");
    colorblindButton.textContent = isColorblind ? "👁️‍🗨️" : "👁️";
  }

  // Activar o desactivar Multijugador
  function toggleMultiplayer() {
    isMultiplayer = !isMultiplayer;
    if (isMultiplayer) {
      multiplayerToggle.textContent = "Modo Multi: ON";
      multiplayerToggle.classList.add("selected");
      sbTitle.innerHTML = "👥 <b>Multijugador</b>";
      turnIndicator.style.display = "block";
      p1Container.innerHTML = "Jugador 1: <span id='p1Score'>" + p1Score + "</span> pts";
      p2Container.style.display = "block";
    } else {
      multiplayerToggle.textContent = "Modo Multi: OFF";
      multiplayerToggle.classList.remove("selected");
      sbTitle.innerHTML = "🏆 <b>Puntuación</b>";
      turnIndicator.style.display = "none";
      p1Container.innerHTML = "Puntos: <span id='p1Score'>" + p1Score + "</span>";
      p2Container.style.display = "none";
    }
    reset();
  }

  // Botones de Modo de Juego
  function setupModeButtons() {
    for (let i = 0; i < modeButtons.length; i++) {
      modeButtons[i].addEventListener("click", function () {
        for (let j = 0; j < modeButtons.length; j++) {
          modeButtons[j].classList.remove("selected");
        }
        this.classList.add("selected");
        
        const modeText = this.textContent.trim();
        if (modeText === "Baby") numSquares = 2;
        else if (modeText === "Easy") numSquares = 3;
        else if (modeText === "Hard") numSquares = 6;
        else if (modeText === "Hardcore") numSquares = 12;
        else if (modeText === "Madness") numSquares = 24;

        reset();
      });
    }
  }

  // Click en cada cuadrado
  function setupSquares() {
    for (let i = 0; i < squares.length; i++) {
      squares[i].addEventListener("click", function () {
        // Si el cuadrado ya fue presionado (inactivo), ignorar
        if (this.style.backgroundColor === "var(--bg)" || this.style.display === "none") return;

        const clickedColor = this.style.backgroundColor;

        if (clickedColor === pickedColor) {
          // ¡Acertó! Calcular puntos basados en la dificultad y restar penalización por errores
          let baseMultiplier = 1;
          if (numSquares === 3) baseMultiplier = 2;     // Easy
          if (numSquares === 6) baseMultiplier = 4;     // Hard
          if (numSquares === 12) baseMultiplier = 8;    // Hardcore
          if (numSquares === 24) baseMultiplier = 16;   // Madness

          let maxPoints = numSquares * 10 * baseMultiplier;
          let penaltyPerMistake = 10 * baseMultiplier;
          // Garantiza al menos 1 punto
          let earnedPoints = Math.max(1, maxPoints - (currentMistakes * penaltyPerMistake));

          if (isMultiplayer) {
            if (currentPlayer === 1) {
              p1Score += earnedPoints;
              document.getElementById("p1Score").textContent = p1Score;
              message.textContent = `¡Jugador 1 gana +${earnedPoints} pts!`;
            } else {
              p2Score += earnedPoints;
              p2ScoreSpan.textContent = p2Score;
              message.textContent = `¡Jugador 2 gana +${earnedPoints} pts!`;
            }
          } else {
            p1Score += earnedPoints;
            document.getElementById("p1Score").textContent = p1Score;
            message.textContent = `¡Correcto! (+${earnedPoints} pts)`;
          }

          resetButton.textContent = "Play Again?";
          h1.style.backgroundColor = pickedColor;
          changeColors(pickedColor);

        } else {
          // Falló: oculta el bloque incorrecto y aumenta el contador de errores
          this.style.backgroundColor = "var(--bg)";
          currentMistakes++;

          if (isMultiplayer) {
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            turnIndicator.textContent = `Turno: Jugador ${currentPlayer}`;
            message.textContent = `¡Falló! Turno de J${currentPlayer}`;
          } else {
            message.textContent = "Inténtalo nuevamente (-puntos)";
          }
        }
      });
    }
  }

  // Reinicia el juego con nuevos colores y escala los bloques
  function reset() {
    colors = generateRandomColors(numSquares);
    pickedColor = pickColor();
    colorDisplay.textContent = pickedColor;
    resetButton.textContent = "Nuevos Colores";
    message.textContent = "";
    h1.style.backgroundColor = "";
    currentMistakes = 0; // Reiniciar errores de la ronda actual

    if (isMultiplayer) {
      turnIndicator.textContent = `Turno: Jugador ${currentPlayer}`;
    }

    for (let i = 0; i < squares.length; i++) {
      if (colors[i]) {
        squares[i].style.display = "block";
        squares[i].style.backgroundColor = colors[i];

        // Escalado dinámico según el modo
        if (numSquares === 2 || numSquares === 3 || numSquares === 6) {
          squares[i].style.width = "30%";
          squares[i].style.margin = "1.66%";
        } else if (numSquares === 12) {
          squares[i].style.width = "22%";
          squares[i].style.margin = "1.5%";
        } else if (numSquares === 24) {
          squares[i].style.width = "14%";
          squares[i].style.margin = "1%";
        }
      } else {
        squares[i].style.display = "none";
      }
    }
  }

  // Pinta todos los cuadrados con el mismo color
  function changeColors(color) {
    for (let i = 0; i < squares.length; i++) {
      squares[i].style.backgroundColor = color;
    }
  }

  // Elige el color ganador del Arreglo
  function pickColor() {
    const random = Math.floor(Math.random() * colors.length);
    return colors[random];
  }

  // Arma un Arreglo de colores random
  function generateRandomColors(num) {
    const arr = [];
    for (let i = 0; i < num; i++) {
      arr.push(randomColor());
    }
    return arr;
  }

  // Devuelve un color random: "rgb(240, 14, 128)"
  function randomColor() {
    const r = Math.floor(Math.random() * 256);
    const g = Math.floor(Math.random() * 256);
    const b = Math.floor(Math.random() * 256);
    return "rgb(" + r + ", " + g + ", " + b + ")";
  }

  init();
</script>

</body>
</html>
