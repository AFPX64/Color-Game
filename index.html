<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great Guessing Game</title>
<style>
  /* Colores de cada tema */
  :root {
    --bg: #232323;
    --line: transparent;
    --toggle-bg: #f5f5f5;
  }

  body.light {
    --bg: #f2f2f2;
    --line: #d6d6d6;
    --toggle-bg: #232323;
  }

  /* Modo Daltónico: Eleva la dificultad a escala de grises y contraste extremo */
  body.colorblind {
    filter: grayscale(100%) contrast(160%);
  }

  body {
    background-color: var(--bg);
    margin: 0;
    font-family: "Montserrat", "Segoe UI", Arial, sans-serif;
    transition: background-color 0.4s;
  }

  h1 {
    background-color: steelblue;
    color: white;
    margin: 0;
    padding: 24px 12px;
    text-align: center;
    text-transform: uppercase;
    font-weight: normal;
    line-height: 1.1;
    transition: background-color 0.4s;
  }

  #colorDisplay {
    display: block;
    font-size: 200%;
    margin: 8px 0;
  }

  #stripe {
    background-color: white;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 8px 12px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    align-items: center;
    text-align: center;
  }

  /* Botones sin aspecto clásico ni outline */
  button {
    background: none;
    border: none;
    color: steelblue;
    font: inherit;
    text-transform: uppercase;
    height: 32px;
    padding: 0 10px;
    cursor: pointer;
    outline: none;
    transition: color 0.3s, background-color 0.3s;
  }

  button:hover,
  button.selected {
    background-color: steelblue;
    color: white;
  }

  /* Botón de tema (Oscuro/Claro) */
  #themeToggle {
    position: fixed;
    top: 8px;
    right: 8px;
    z-index: 10;
    width: 36px;
    height: 36px;
    padding: 0;
    border-radius: 50%;
    background-color: var(--toggle-bg);
    font-size: 18px;
    line-height: 36px;
    transition: background-color 0.4s, transform 0.2s;
  }

  #themeToggle:hover {
    background-color: var(--toggle-bg);
    transform: scale(1.1);
  }

  /* Botón de Modo Daltónico */
  #colorblindToggle {
    position: fixed;
    top: 8px;
    right: 52px;
    z-index: 10;
    width: 36px;
    height: 36px;
    padding: 0;
    border-radius: 50%;
    background-color: var(--toggle-bg);
    font-size: 18px;
    line-height: 36px;
    transition: background-color 0.4s, transform 0.2s;
  }

  #colorblindToggle:hover {
    background-color: var(--toggle-bg);
    transform: scale(1.1);
  }

  /* Mensaje con ancho mínimo estático */
  #message {
    display: inline-block;
    min-width: 170px;
    text-align: center;
    color: #232323;
    text-transform: uppercase;
    font-size: 0.9rem;
    white-space: nowrap;
  }

  #container {
    display: flex;
    flex-wrap: wrap;
    max-width: 600px;
    margin: 20px auto;
    justify-content: center;
  }

  .square {
    aspect-ratio: 1;
    border-radius: 15%;
    cursor: pointer;
    transition: background-color 0.5s;
  }
</style>
</head>
<body>

<button id="colorblindToggle" aria-label="Activar modo daltónico">👁️</button>
<button id="themeToggle" aria-label="Cambiar tema">☀️</button>

<h1>
  The Great
  <span id="colorDisplay">RGB</span>
  Guessing Game
</h1>

<div id="stripe">
  <button id="reset">Nuevos Colores</button>
  <span id="message"></span>
  <button class="mode">Baby</button>
  <button class="mode">Easy</button>
  <button class="mode selected">Hard</button>
  <button class="mode">Hardcore</button>
  <button class="mode">Madness</button>
</div>

<div id="container">
  <!-- 24 cuadrados para soportar hasta el modo Madness -->
  <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
  <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
  <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
  <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
  <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
  <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
</div>

<script>
  // Variables
  let numSquares = 6;
  let colors;
  let pickedColor;

  // Selectores
  const squares = document.querySelectorAll(".square");
  const colorDisplay = document.getElementById("colorDisplay");
  const message = document.getElementById("message");
  const h1 = document.querySelector("h1");
  const resetButton = document.getElementById("reset");
  const modeButtons = document.querySelectorAll(".mode");
  const themeButton = document.getElementById("themeToggle");
  const colorblindButton = document.getElementById("colorblindToggle");

  resetButton.addEventListener("click", reset);
  themeButton.addEventListener("click", toggleTheme);
  colorblindButton.addEventListener("click", toggleColorblind);

  // Cuando carga la página
  function init() {
    setupModeButtons();
    setupSquares();
    reset();
  }

  // Cambia entre tema oscuro y claro
  function toggleTheme() {
    document.body.classList.toggle("light");
    const isLight = document.body.classList.contains("light");
    themeButton.textContent = isLight ? "🌙" : "☀️";
  }

  // Activa o desactiva el modo daltónico
  function toggleColorblind() {
    document.body.classList.toggle("colorblind");
    const isColorblind = document.body.classList.contains("colorblind");
    colorblindButton.textContent = isColorblind ? "👁️‍🗨️" : "👁️";
  }

  // Botones de Modo de Juego (Baby, Easy, Hard, Hardcore, Madness)
  function setupModeButtons() {
    for (let i = 0; i < modeButtons.length; i++) {
      modeButtons[i].addEventListener("click", function () {
        for (let j = 0; j < modeButtons.length; j++) {
          modeButtons[j].classList.remove("selected");
        }
        this.classList.add("selected");
        
        const modeText = this.textContent.trim();
        if (modeText === "Baby") numSquares = 2;
        else if (modeText === "Easy") numSquares = 3;
        else if (modeText === "Hard") numSquares = 6;
        else if (modeText === "Hardcore") numSquares = 12;
        else if (modeText === "Madness") numSquares = 24;

        reset();
      });
    }
  }

  // Click en cada cuadrado
  function setupSquares() {
    for (let i = 0; i < squares.length; i++) {
      squares[i].addEventListener("click", function () {
        const clickedColor = this.style.backgroundColor;
        if (clickedColor === pickedColor) {
          message.textContent = "¡Correcto!";
          resetButton.textContent = "Play Again?";
          h1.style.backgroundColor = pickedColor;
          changeColors(pickedColor);
        } else {
          this.style.backgroundColor = "var(--bg)";
          message.textContent = "Intentalo nuevamente";
        }
      });
    }
  }

  // Reinicia el juego con nuevos colores y escala los bloques
  function reset() {
    colors = generateRandomColors(numSquares);
    pickedColor = pickColor();
    colorDisplay.textContent = pickedColor;
    resetButton.textContent = "Nuevos Colores";
    message.textContent = "";
    h1.style.backgroundColor = "";

    for (let i = 0; i < squares.length; i++) {
      if (colors[i]) {
        squares[i].style.display = "block";
        squares[i].style.backgroundColor = colors[i];

        // Escalado dinámico según el modo para que quepan en pantalla
        if (numSquares === 2 || numSquares === 3 || numSquares === 6) {
          squares[i].style.width = "30%";
          squares[i].style.margin = "1.66%";
        } else if (numSquares === 12) {
          squares[i].style.width = "22%";
          squares[i].style.margin = "1.5%";
        } else if (numSquares === 24) {
          squares[i].style.width = "14%";
          squares[i].style.margin = "1%";
        }
      } else {
        squares[i].style.display = "none";
      }
    }
  }

  // Pinta todos los cuadrados con el mismo color
  function changeColors(color) {
    for (let i = 0; i < squares.length; i++) {
      squares[i].style.backgroundColor = color;
    }
  }

  // Elige el color ganador del Arreglo
  function pickColor() {
    const random = Math.floor(Math.random() * colors.length);
    return colors[random];
  }

  // Arma un Arreglo de colores random
  function generateRandomColors(num) {
    const arr = [];
    for (let i = 0; i < num; i++) {
      arr.push(randomColor());
    }
    return arr;
  }

  // Devuelve un color random: "rgb(240, 14, 128)"
  function randomColor() {
    const r = Math.floor(Math.random() * 256);
    const g = Math.floor(Math.random() * 256);
    const b = Math.floor(Math.random() * 256);
    return "rgb(" + r + ", " + g + ", " + b + ")";
  }

  init();
</script>

</body>
</html>
